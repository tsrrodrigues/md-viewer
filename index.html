<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Markdown Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #555;
      --code-bg: #f6f8fa;
      --border: #e1e4e8;
      --link: #0366d6;
      --blockquote-border: #dfe2e5;
      --blockquote-text: #6a737d;
      --table-border: #dfe2e5;
      --table-stripe: #f6f8fa;
      --kbd-bg: #fafbfc;
      --kbd-border: #d1d5da;
      --hr: #e1e4e8;
      --header-border: #eaecef;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --code-bg: #161b22;
      --border: #30363d;
      --link: #58a6ff;
      --blockquote-border: #3b434b;
      --blockquote-text: #8b949e;
      --table-border: #30363d;
      --table-stripe: #161b22;
      --kbd-bg: #161b22;
      --kbd-border: #30363d;
      --hr: #21262d;
      --header-border: #21262d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px 20px 40px;
      max-width: 100%;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
      -webkit-text-size-adjust: 100%;
    }

    #content {
      max-width: 720px;
      margin: 0 auto;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Typography */
    #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    #content h1 { font-size: 1.8em; padding-bottom: 0.3em; border-bottom: 1px solid var(--header-border); }
    #content h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--header-border); }
    #content h3 { font-size: 1.25em; }
    #content h4 { font-size: 1em; }
    #content h5 { font-size: 0.875em; }
    #content h6 { font-size: 0.85em; color: var(--text-secondary); }

    #content p { margin-bottom: 16px; }

    #content a { color: var(--link); text-decoration: none; }
    #content a:hover { text-decoration: underline; }

    /* Lists */
    #content ul, #content ol { margin-bottom: 16px; padding-left: 2em; }
    #content li { margin-bottom: 4px; }
    #content li > ul, #content li > ol { margin-bottom: 0; }

    /* Code */
    #content code {
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
      font-size: 0.875em;
      background: var(--code-bg);
      border-radius: 6px;
      padding: 0.2em 0.4em;
    }

    #content pre {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--code-bg);
      border-radius: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
    }

    #content pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.5;
      white-space: pre;
    }

    /* Copy button for code blocks */
    .code-wrapper { position: relative; }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--border);
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      color: var(--text);
    }

    .code-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn.copied { background: #28a745; color: white; }

    /* Blockquote */
    #content blockquote {
      margin-bottom: 16px;
      padding: 0 1em;
      color: var(--blockquote-text);
      border-left: 4px solid var(--blockquote-border);
    }
    #content blockquote > :last-child { margin-bottom: 0; }

    /* Tables */
    #content table {
      margin-bottom: 16px;
      border-collapse: collapse;
      width: 100%;
      overflow-x: auto;
      display: block;
      -webkit-overflow-scrolling: touch;
    }

    #content th, #content td {
      padding: 8px 16px;
      border: 1px solid var(--table-border);
      text-align: left;
    }

    #content th { font-weight: 600; background: var(--table-stripe); }
    #content tr:nth-child(even) { background: var(--table-stripe); }

    /* HR */
    #content hr {
      margin: 24px 0;
      border: none;
      height: 2px;
      background: var(--hr);
      border-radius: 1px;
    }

    /* Images */
    #content img { max-width: 100%; height: auto; border-radius: 8px; }

    /* Kbd */
    #content kbd {
      font-family: 'SF Mono', monospace;
      font-size: 0.8em;
      padding: 2px 6px;
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-radius: 4px;
      box-shadow: inset 0 -1px 0 var(--kbd-border);
    }

    /* Checkbox */
    #content input[type="checkbox"] { margin-right: 6px; }

    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
      color: var(--text-secondary);
      font-size: 1.1em;
    }

    .loading .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--link);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .error h2 { margin-bottom: 8px; color: #e74c3c; }
  </style>
</head>
<body>
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <span>Carregando...</span>
    </div>
  </div>

  <script>
    // Theme detection - integrates with Telegram Mini App theme
    function applyTheme() {
      const tg = window.Telegram?.WebApp;
      let theme = 'light';

      if (tg && tg.colorScheme) {
        theme = tg.colorScheme;
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        theme = 'dark';
      }

      document.documentElement.setAttribute('data-theme', theme);

      // Apply Telegram theme colors if available
      if (tg?.themeParams) {
        const tp = tg.themeParams;
        if (tp.bg_color) document.body.style.background = tp.bg_color;
        if (tp.text_color) document.body.style.color = tp.text_color;
      }

      // Update highlight.js theme
      const hljsLink = document.getElementById('hljs-theme');
      hljsLink.href = theme === 'dark'
        ? 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css'
        : 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css';
    }

    // Configure marked
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    // Wrap code blocks with copy button
    function addCopyButtons() {
      document.querySelectorAll('#content pre').forEach(pre => {
        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copiar';
        btn.onclick = () => {
          const code = pre.querySelector('code')?.textContent || pre.textContent;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = '✓';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = 'Copiar';
              btn.classList.remove('copied');
            }, 2000);
          });
        };
        wrapper.appendChild(btn);
      });
    }

    // --- Content Sources ---

    // 1. URL hash: base64-encoded content
    function getContentFromHash() {
      const hash = window.location.hash.substring(1);
      if (!hash) return null;
      try {
        return decodeURIComponent(escape(atob(hash)));
      } catch {
        try { return atob(hash); } catch { return null; }
      }
    }

    // 2. URL parameter: fetch from external URL
    async function getContentFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('url');
      if (!url) return null;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Fetch failed: ${resp.status}`);
      return await resp.text();
    }

    // 3. Telegram Mini App: start_param contains a gist ID
    async function getContentFromStartParam() {
      const tg = window.Telegram?.WebApp;
      const startParam = tg?.initDataUnsafe?.start_param;
      if (!startParam) return null;

      // start_param format: gist ID (hex string) or base64url-encoded short content
      // Try as gist ID first (32 hex chars)
      if (/^[a-f0-9]{20,}$/i.test(startParam)) {
        const rawUrl = `https://gist.githubusercontent.com/raw/${startParam}/content.md`;
        const resp = await fetch(rawUrl);
        if (resp.ok) return await resp.text();
      }

      // Try as base64url-encoded content
      try {
        const b64 = startParam.replace(/-/g, '+').replace(/_/g, '/');
        const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
        return decodeURIComponent(escape(atob(padded)));
      } catch {
        return null;
      }
    }

    // Render
    async function render() {
      const el = document.getElementById('content');
      applyTheme();

      try {
        // Try content sources in order
        let md = getContentFromHash();

        if (!md) {
          md = await getContentFromStartParam();
        }

        if (!md) {
          md = await getContentFromUrl();
        }

        if (!md) {
          el.innerHTML = '<div class="error"><h2>🤷</h2><p>Nenhum conteúdo para exibir.</p></div>';
          return;
        }

        el.innerHTML = marked.parse(md);
        addCopyButtons();

        // Telegram WebApp ready signal
        const tg = window.Telegram?.WebApp;
        if (tg) {
          tg.ready();
          tg.expand();
        }
      } catch (err) {
        el.innerHTML = `<div class="error"><h2>Erro</h2><p>${err.message}</p></div>`;
      }
    }

    render();

    // Listen for theme changes from Telegram
    window.Telegram?.WebApp?.onEvent('themeChanged', applyTheme);
  </script>
</body>
</html>
